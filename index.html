<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sajtovi</title>
<style>
:root{--bg:#F6FAFB;--fg:#17323A;--muted:#5B7177;--line:#D6E6E7;--accent:#1F9E95}
@media (prefers-color-scheme:dark){:root{--bg:#0F1D21;--fg:#E8F3F3;--muted:#9DB4B7;--line:#264247;--accent:#46C4B9;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:56px 20px}
h1{font-size:2rem;margin:0 0 24px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
a{display:block;padding:16px 20px;border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none}
a:hover{border-color:var(--accent)}
a small{display:block;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Sajtovi</h1>
<ul>
<li><a href="lunja-groom/">Lunja Groom<small>Salon za pse i mačke, Pančevo</small></a></li>
<li><a href="studio-tepsa/">Studio Tepsa<small>Šminkanje i edukacije</small></a></li>
<li><a href="ziva-vet/">Živa Vet<small>Veterinarska ordinacija</small></a></li>
</ul>
</main>
</body>
</html>
